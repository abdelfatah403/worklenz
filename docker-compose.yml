services:
  frontend:
    image: chamikajaycey/worklenz-frontend:3.3.1
    container_name: worklenz_frontend
    ports:
      - "5000:5000"
    depends_on:
      - backend
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      - worklenz

  backend:
    image: chamikajaycey/worklenz-backend:3.3.1
    container_name: worklenz_backend
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:${MINIO_API_PORT:-9000}/${S3_BUCKET:-worklenz-bucket}}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Allows the current published image to start when Google OAuth is not configured.
      # Replace these defaults with real credentials in .env to enable Google sign-in.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-disabled}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://localhost/api/auth/google/verify}
      WORKLENZ_DEPLOYMENT_MODE: ${WORKLENZ_DEPLOYMENT_MODE:-self_hosted}
    networks:
      - worklenz

  client-portal:
    image: chamikajaycey/worklenz-client-portal:3.3.1
    container_name: worklenz_client_portal
    ports:
      - "5174:5174"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - worklenz

  # MinIO community images were removed from Docker Hub (and Quay requires
  # auth now), so this uses the maintained Chainguard build of the same server.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: worklenz_minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-minioadmin}}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-minioadmin}}
      # The browser uploads directly to MinIO with presigned PUT URLs, so the
      # API must accept cross-origin requests from the Worklenz frontend.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ALLOW_ORIGIN:-*}
      MC_CONFIG_DIR: /tmp/.mc
    volumes:
      - worklenz_minio_data:/data
    depends_on:
      minio-permissions:
        condition: service_completed_successfully
    healthcheck:
      # The Chainguard image runs as non-root and ships `mc` (not curl/wget).
      test:
        [
          "CMD-SHELL",
          "mc alias set local http://127.0.0.1:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1 && mc ready local",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - worklenz

  # The Chainguard image runs as uid 65532, so a fresh root-owned named volume
  # must be handed over before MinIO can write to it.
  minio-permissions:
    image: busybox:1.37
    container_name: worklenz_minio_permissions
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - worklenz_minio_data:/data
    restart: "no"
    networks:
      - worklenz

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    container_name: worklenz_minio_init
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-${AWS_ACCESS_KEY_ID:-minioadmin}}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-${AWS_SECRET_ACCESS_KEY:-minioadmin}}
      S3_BUCKET: ${S3_BUCKET:-${AWS_BUCKET:-worklenz-bucket}}
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        # Attachments are linked with S3_PUBLIC_URL, so the bucket must allow
        # anonymous downloads. Uploads still require credentials.
        mc anonymous set download "local/$${S3_BUCKET}"
    networks:
      - worklenz

  nginx:
    image: nginx:alpine
    container_name: worklenz_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - worklenz

  db:
    image: postgres:15
    container_name: worklenz_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-worklenz_db}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -d ${DB_NAME:-worklenz_db} -U ${DB_USER:-postgres}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - worklenz
    volumes:
      - worklenz_postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./worklenz-backend/database/sql
        target: /docker-entrypoint-initdb.d/sql
        consistency: cached
      - type: bind
        source: ./worklenz-backend/database/00_init.sh
        target: /docker-entrypoint-initdb.d/00_init.sh
        consistency: cached
      - type: bind
        source: ./pg_backups
        target: /docker-entrypoint-initdb.d/pg_backups
    command: >
        bash -c '
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y dos2unix
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache dos2unix
          fi

          find /docker-entrypoint-initdb.d -type f -name "*.sh" -exec sh -c '"'"'
            for f; do
              dos2unix "$$f" 2>/dev/null || true
              chmod +x "$$f"
            done
          '"'"' sh {} +

          exec docker-entrypoint.sh postgres
        '
  db-backup:
    image: postgres:15
    container_name: worklenz_db_backup
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-worklenz_db}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./pg_backups:/pg_backups #host dir for backups files
    #setup bassh loop to backup data evey 24h
    command: >
           bash -c 'while true; do
              sleep 86400;
              PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h worklenz_db -U $$POSTGRES_USER -d $$POSTGRES_DB \
              > /pg_backups/worklenz_db_$$(date +%Y-%m-%d_%H-%M-%S).sql;
              find /pg_backups -type f -name "*.sql" -mtime +30 -delete;
            done'
    restart: unless-stopped
    networks:
      - worklenz

volumes:
  worklenz_postgres_data:
  worklenz_minio_data:
    name: worklenz_minio_data
  # Retained so data from the previous SeaweedFS backend is not removed by
  # `docker compose down -v`. It is no longer mounted by any service.
  worklenz_seaweedfs_data:
    name: worklenz_seaweedfs_data
  pgdata:

networks:
  worklenz:
